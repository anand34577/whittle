# Release: push a tag like v0.2.0 (it must match package.json) and this builds
# and publishes everything to a GitHub Release:
#
#   Desktop   Windows x64 (.msi, .exe), macOS universal (.dmg, Intel + Apple silicon),
#             Linux x64 and arm64 (.AppImage, .deb, .rpm)
#   Server    static Linux binaries for x86_64 and aarch64 (bare metal, LXC, VMs),
#             packaged with the web app, a systemd unit and an installer
#   Docker    ghcr.io/<owner>/whittle for linux/amd64 and linux/arm64
#   SHA256SUMS for every file
#
# Optional signing (add these repository secrets and they are used automatically):
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: sign the .msi/.exe afterwards with your code-signing tool, or configure bundle.windows in tauri.conf.json
# Without them, macOS builds are ad-hoc signed (users right-click → Open the first time).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.2.0. It must already exist."
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check version and create the draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag must match the app version
        run: |
          version="${TAG#v}"
          for f in package.json apps/desktop/src-tauri/tauri.conf.json; do
            got=$(node -p "require('./$f').version")
            [ "$got" = "$version" ] || { echo "::error::$f has version $got but the tag is $TAG"; exit 1; }
          done
          for f in apps/server/Cargo.toml apps/desktop/src-tauri/Cargo.toml; do
            got=$(grep -m1 '^version' "$f" | cut -d'"' -f2)
            [ "$got" = "$version" ] || { echo "::error::$f has version $got but the tag is $TAG"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: r
        name: Create (or reuse) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --verify-tag --title "Whittle ${TAG#v}" --generate-notes
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --locked
        working-directory: apps/server

  web:
    name: Web app
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload the static web build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="whittle-web-${{ needs.prepare.outputs.version }}"
          cp -r apps/web/dist "$name"
          tar czf "$name.tar.gz" "$name"
          gh release upload "$TAG" "$name.tar.gz" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: ""
          - name: macOS universal
            runner: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux x64
            runner: ubuntu-22.04
            args: ""
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.runner, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: node ../../node_modules/@tauri-apps/cli/tauri.js
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  server:
    name: Server (Linux ${{ matrix.arch }})
    needs: [prepare, verify, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            docker: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build a static binary
        working-directory: apps/server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web
      - name: Package
        id: pkg
        run: |
          name="whittle-server-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "$name/deploy"
          cp "apps/server/target/${{ matrix.target }}/release/whittle-server" "$name/"
          cp -r web "$name/web"
          cp deploy/whittle.service deploy/whittle.openrc deploy/whittle.env.example deploy/install.sh "$name/deploy/"
          cp docs/SELF_HOSTING.md "$name/README.md"
          cp LICENSE THIRD_PARTY_LICENSES.md "$name/"
          chmod +x "$name/whittle-server" "$name/deploy/install.sh"
          "$name/whittle-server" --version
          tar czf "$name.tar.gz" "$name"
          echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          # Layout for the Docker build.
          mkdir -p "docker/${{ matrix.docker }}" && cp "$name/whittle-server" "docker/${{ matrix.docker }}/"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.pkg.outputs.file }}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.docker }}
          path: docker/${{ matrix.docker }}

  docker:
    name: Docker image
    needs: [prepare, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: release/web
      - name: Arrange the build context
        run: |
          for a in amd64 arm64; do mv "release/server-$a" "release/$a"; chmod +x "release/$a/whittle-server"; done
          ls -R release | head -n 40
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/whittle
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: release
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: Checksums and publish
    needs: [prepare, web, desktop, server]
    runs-on: ubuntu-latest
    steps:
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
