[package]
name = "whittle-desktop"
version = "0.5.0"
description = "Whittle: open-source parametric 3D CAD"
authors = ["Whittle contributors"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "whittle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true